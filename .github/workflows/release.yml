name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm build
      - run: pnpm test

      # approve it on npmjs.com (2FA) afterwards
      # --no-git-checks: tag checkout is a detached HEAD, not main
      - name: Stage publish to npm
        run: pnpm stage publish --no-git-checks

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
